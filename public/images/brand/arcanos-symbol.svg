      stroke-width="8"
    />
    <path
      d="M36 102 L64 34 L92 102"
      fill="none"
      stroke="url(#silver-gradient)"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="8"
    />
    <path
      d="M51 80 Q64 88 77 80"
      fill="none"
      stroke="url(#gold-gradient)"
      stroke-linecap="round"
      stroke-width="8"
    />
  </g>
</svg>
