<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Simbolo da Arcanos</title>
  <desc id="desc">Arco dourado com monograma A metalizado em fundo transparente.</desc>
  <defs>
    <linearGradient id="gold-gradient" x1="18" y1="94" x2="110" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d88900" />
      <stop offset="0.45" stop-color="#f4b942" />
      <stop offset="1" stop-color="#ffd978" />
    </linearGradient>
    <linearGradient id="silver-gradient" x1="34" y1="100" x2="92" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8c0ce" />
      <stop offset="0.48" stop-color="#ffffff" />
      <stop offset="1" stop-color="#dfe5ef" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#020817" flood-opacity="0.25" />
    </filter>
  </defs>
  <g filter="url(#soft-shadow)">
    <path
      d="M26 84 A44 44 0 1 1 102 84"
      fill="none"
      stroke="url(#gold-gradient)"
