  </text>
  <text x="94" y="486" fill="#f4b942" font-family="Palatino Linotype, Georgia, serif" font-size="70" font-weight="700">
    operacao condominial.
  </text>
  <text x="94" y="548" fill="#dfe5ef" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-size="28">
